<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المكتبة القانونية — CHRAIM</title>
<style>body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:#060B19;color:#F3E5AB;padding:24px;max-width:960px;margin:0 auto}
.card{background:rgba(28,37,65,.7);border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:12px;margin:8px 0}
a{color:#D4AF37}
</style>
</head>
<body>
<h1>المكتبة القانونية (PDFs)</h1>
<p>مستندات مقدمة من المستخدم. كل ملف له رابط تحميل.</p>
<div id="list"></div>
<p><a href="/" style="color:#D4AF37">← العودة للرئيسية</a></p>
<script>
fetch('/data/legal-library.json').then(r=>r.json()).then(d=>{
  const list=document.getElementById('list');
  (d.items||[]).forEach(it=>{
    const card=document.createElement('div'); card.className='card';
    const a=document.createElement('a'); a.href=it.url; a.textContent=it.title; a.style.fontWeight='bold';
    card.appendChild(a); list.appendChild(card);
  });
}).catch(e=>{document.getElementById('list').textContent='تعذر تحميل القائمة';});
</script>
</body>
</html>
