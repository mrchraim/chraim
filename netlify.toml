# CHRAIM — إعداد Netlify (الرؤوس الأمنية تأتي من ملف _headers الذي يُنسخ إلى dist/)
[build]
  command = "npm run build:css && python3 tools/build-dist.py --out dist --clean && python3 tools/audit-links.py --root dist"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
