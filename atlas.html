<body>
<h1>CHRVVIM KNOWLEDGE ATLAS</h1>
<p>فهرس الموارد (CSP-safe). تصفح/بحث/تصدير.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
  <input id="q" placeholder="بحث..." oninput="filter()">
  <button class="btn" onclick="exportJSON()">تصدير JSON</button>
  <button class="btn" onclick="exportCSV()">تصدير CSV</button>
</div>
<div id="grid" class="grid"></div>
<p><a href="/" style="color:#D4AF37">← العودة للرئيسية</a></p>
<script>
let all=[];
async function load(){
  try {
    const r=await fetch('/data/resources.json');
    const d=await r.json();
    all = (d.sources||[]).map(s=>({id:s.url,title:s.title,publisher:s.badge||'source',file_format:s.type||'link',original_url:s.url}));
    render(all);
  } catch(e){ document.getElementById('grid').textContent='تعذر تحميل البيانات'; }
}
function render(items){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  items.forEach(it=>{
    const card=document.createElement('div'); card.className='card';
    const h=document.createElement('h3'); h.textContent=it.title; h.style.margin='0 0 8px 0';
    const meta=document.createElement('div'); meta.style.fontSize='.8rem'; meta.style.color='#9aa3b5'; meta.textContent=it.publisher+' · '+it.file_format;
    const a=document.createElement('a'); a.href=it.original_url; a.target='_blank'; a.rel='noopener noreferrer'; a.className='btn'; a.style.display='inline-block'; a.style.marginTop='8px'; a.textContent='فتح المصدر';
    card.appendChild(h); card.appendChild(meta); card.appendChild(a);
    grid.appendChild(card);
  });
}
function filter(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const f=all.filter(x=>(x.title+' '+x.publisher).toLowerCase().includes(q));
  render(f);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='atlas_resources.json'; a.click(); URL.revokeObjectURL(u);
}
function exportCSV(){
  const keys=['title','publisher','file_format','original_url'];
  const rows=[keys.join(','), ...all.map(r=>keys.map(k=>`"${(r[k]||'').toString().replace(/"/g,'""')}"`).join(','))];
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='atlas_resources.csv'; a.click(); URL.revokeObjectURL(u);
}
load();
</script>
