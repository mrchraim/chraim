name: Source health watch

# سبب وجودها: المشروع يعتمد على مصادر رسمية خارجية (uiz.ac.ma، بوابة PREINSCRIPTION،
# المواقع الرسمية للمؤسسات). نراقب "الوصول فقط" كل أسبوع؛ أي فشل في القنوات الحرجة
# يُسقط المهمة بدل أن يمر بسلام.

on:
  schedule:
    - cron: "15 5 * * 3" # كل أربعاء 05:15 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chraim-source-watch
  cancel-in-progress: false

jobs:
  probe:
    name: Official sources reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official sources
        shell: bash
        run: python3 tools/verify-official-sources.py --strict

      - name: Upload report (markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-status-report
          path: docs/SOURCES_STATUS.md
          retention-days: 30
          if-no-files-found: error
