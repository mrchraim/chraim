name: CHRAIM Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chraim-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build, unit tests, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project configuration
        run: |
          test -f package.json || {
            echo "::error::package.json is missing"
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json is missing"
            exit 1
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Format check
        run: npm run format:check --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Build CSS
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['build:css'] ? 0 : 1)"; then
            npm run build:css
          else
            echo "No build:css script configured; skipping."
          fi

      - name: Build distribution
        shell: bash
        run: |
          if [ -f tools/build-dist.py ]; then
            python tools/build-dist.py --out dist --clean
          elif node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::error::No supported build command found."
            exit 1
          fi

      - name: Verify generated site
        run: |
          test -d dist || {
            echo "::error::dist/ is missing"
            exit 1
          }

          test -s dist/index.html || {
            echo "::error::dist/index.html is missing or empty"
            exit 1
          }

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: chraim-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  links-security:
    name: Links and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci

      - name: Build distribution
        shell: bash
        run: |
          if [ -f tools/build-dist.py ]; then
            python tools/build-dist.py --out dist --clean
          elif node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::error::No supported build command found."
            exit 1
          fi

      - name: Verify generated site
        run: |
          test -s dist/index.html || {
            echo "::error::dist/index.html is missing or empty"
            exit 1
          }

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan (dependency-free)
        run: python tools/secret-scan.py

      - name: Check local links
        run: python tools/audit-links.py --root dist

      - name: Verify deployment configuration
        run: |
          test -f tools/verify_deployment_config.py || {
            echo "::error::Deployment verification script is missing"
            exit 1
          }

          python tools/verify_deployment_config.py

  browser-a11y:
    name: Lighthouse and axe accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build-and-unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: npm ci

      - name: Build distribution
        shell: bash
        run: |
          if [ -f tools/build-dist.py ]; then
            python tools/build-dist.py --out dist --clean
          elif node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "::error::No supported build command found."
            exit 1
          fi

      - name: Verify audit configuration
        run: |
          test -f .lighthouserc.json || {
            echo "::error::.lighthouserc.json is missing"
            exit 1
          }

          test -f tools/run-axe-audit.cjs || {
            echo "::error::tools/run-axe-audit.cjs is missing"
            exit 1
          }

      - name: Install Lighthouse CI
        run: npm install --no-save --no-package-lock @lhci/cli@0.14.0

      - name: Install Playwright Chromium
        run: |
          npx --yes playwright --version
          npx playwright install --with-deps chromium

      - name: Start local site
        shell: bash
        run: |
          python -m http.server 8000 --directory dist \
            > /tmp/chraim-http.log 2>&1 &

          echo $! > /tmp/chraim-http.pid

          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              echo "Local site ready."
              exit 0
            fi

            sleep 1
          done

          cat /tmp/chraim-http.log
          echo "::error::Local site did not start within 40 seconds."
          exit 1

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=.lighthouserc.json

      - name: Run axe accessibility audit
        run: node tools/run-axe-audit.cjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 7
