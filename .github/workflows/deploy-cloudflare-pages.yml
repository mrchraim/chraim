name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Search index must be up to date
        run: |
          python tools/make-search-index.py
          git diff --exit-code assets/search-index.json || (echo "::error::شغّل python tools/make-search-index.py وارفع assets/search-index.json" && exit 1)

      - name: Security audit (CSP / secrets)
        run: python tools/audit-security.py

      - name: Build clean dist/ (no internal files)
        run: python tools/build-dist.py --out dist --clean

      - name: Audit links in dist/
        run: python tools/audit-links.py --root dist

      # كان هذا الفحص يمرّ بـ"نجاح" مع تخطّي خطوة النشر، فيبدو الـworkflow أخضر
      # بينما الموقع الحيّ لم يتغيّر أبدًا. الآن يفشل صراحةً حتى لا يتكرر الانقسام.
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=النشر مستحيل::CLOUDFLARE_API_TOKEN و/أو CLOUDFLARE_ACCOUNT_ID غير مضبوطين، لذا لن يُنشر أي شيء. أضفهما في Settings → Secrets and variables → Actions، ثم أعد تشغيل هذا الـworkflow."
            exit 1
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chraim
