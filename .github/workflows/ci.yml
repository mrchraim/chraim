name: CI & Quality Gates

on:
  push:
    branches: [main, "improve/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Build one artifact; all downstream audits consume the same output.
  build:
    name: Build & Asset Packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build:css
      - run: python tools/build-dist.py --out dist --clean
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 1

  # 2. Source quality and unit tests.
  code-quality:
    name: Lint, Format & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # 3. Link/security checks run against the exact built artifact.
  security-and-links:
    name: Security & Link Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist
      - run: python tools/audit-links.py --root dist
      - run: python tools/audit-security.py
      - run: python tools/verify_deployment_config.py
      - name: Secret scan (dependency-free)
        run: python tools/secret-scan.py

  # 4. Lighthouse runs on the same build artifact. Reports stay in GitHub artifacts,
  # not in Lighthouse's public temporary storage.
  lighthouse-audit:
    name: Lighthouse Performance & SEO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist
      - name: Serve Static Dist
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory dist > /tmp/chraim-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chraim-http.log
          echo 'Local preview server did not become ready.' >&2
          exit 1
      - name: Lighthouse CI Evaluation
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://127.0.0.1:8000/
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  # 5. axe accessibility smoke audit.
  accessibility-audit:
    name: axe Accessibility Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist
      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve Static Dist
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory dist > /tmp/chraim-axe.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chraim-axe.log
          echo 'Local preview server did not become ready.' >&2
          exit 1
      - name: Run axe Accessibility Engine
        run: |
          if [ -f "tools/run-axe-audit.cjs" ]; then
            node tools/run-axe-audit.cjs
          else
            npx --yes @axe-core/cli http://127.0.0.1:8000/ --exit
          fi
