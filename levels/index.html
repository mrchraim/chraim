<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المستويات — CHRAIM</title>
<style>body{font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:#060B19;color:#F3E5AB;padding:24px;max-width:960px;margin:0 auto}
.card{background:rgba(28,37,65,.7);border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:16px;margin:12px 0}
a{color:#D4AF37}
ul{line-height:2}
</style>
</head>
<body>
<h1>المستويات (ابتدائي · إعدادي · ثانوي)</h1>
<p>قيد البناء — الدروس/الدعم/الشروحات «غير متوفرة بعد». الهيكل (المواد) مبني على مناهج وزارة التربية الوطنية (المغرب).</p>
<div id="levelsRoot"></div>
<p><a href="/">← العودة للرئيسية</a></p>
<script>
async function load(){
  try {
    const r = await fetch('/data/levels-curriculum.json');
    const d = await r.json();
    const root = document.getElementById('levelsRoot');
    Object.keys(d.levels).forEach(k => {
      const L = d.levels[k];
      const card = document.createElement('div');
      card.className='card';
      const h = document.createElement('h2'); h.textContent = L.name; card.appendChild(h);
      if (L.subjects) {
        const ul = document.createElement('ul');
        L.subjects.forEach(s => { const li=document.createElement('li'); li.textContent = s + ' — غير متوفر بعد'; ul.appendChild(li); });
        card.appendChild(ul);
      }
      if (L.branches) {
        Object.keys(L.branches).forEach(bk => {
          const h3 = document.createElement('h3'); h3.textContent = bk; card.appendChild(h3);
          const ul = document.createElement('ul');
          (L.branches[bk]||[]).forEach(s => { const li=document.createElement('li'); li.textContent = s + ' — غير متوفر بعد'; ul.appendChild(li); });
          card.appendChild(ul);
        });
      }
      root.appendChild(card);
    });
  } catch(e){ document.getElementById('levelsRoot').textContent='تعذر تحميل البيانات'; }
}
load();
</script>
<script src="/assets/site-footer.js" defer></script>
</body>
</html>
