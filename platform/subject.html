<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المادة — منصة الطلبة</title>
  <meta name="description" content="تحميل الامتحانات والفروض المصححة للمادة — إصدارات السنوات السابقة مجاناً.">
  <link rel="stylesheet" href="css/site.css">
<link rel="canonical" href="https://chraim.pages.dev/platform/subject">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">📚 <span data-site-name></span></a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html" data-t="home"></a>
        <a href="browse.html" class="active" data-t="browse"></a>
        <a href="announcements.html" data-t="announcements"></a>
        <a href="contribute.html" data-t="contribute"></a>
        <a href="about.html" data-t="about"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">FR</button>
        <a href="account.html" class="btn btn-primary btn-sm" id="account-link" data-t="login"></a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      </div>
    </div>
  </header>

  <div class="page-hero">
    <div class="container">
      <h1 id="subj-title">...</h1>
      <p id="subj-meta"></p>
    </div>
  </div>

  <main class="container section">
    <h2 class="section-title">📋 <span data-t="exams_count"></span></h2>
    <div id="exams-list"><div class="empty"><span class="icon">⏳</span></div></div>

    <div class="ad-slot">مساحة إعلان خفيف</div>

    <h2 class="section-title">💬 <span data-t="questions"></span></h2>
    <div id="questions-list"></div>
    <div class="card" style="margin-top:16px">
      <h3 data-t="ask_question"></h3>
      <div class="form-group" style="margin-top:12px">
        <input type="text" id="q-name" data-t-ph="name">
      </div>
      <div class="form-group">
        <textarea id="q-text" rows="3" data-t-ph="question_ph"></textarea>
      </div>
      <button class="btn btn-primary" onclick="sendQuestion()" data-t="send"></button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom"><span data-t="footer_rights"></span> © 2026 <span data-site-name></span></div>
  </footer>

  <script src="/assets/lib/supabase-js-2.117.3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.querySelectorAll("[data-site-name]").forEach(el => el.textContent = SITE.name_ar);
    (async () => {
      const content = loadSubject();
      await initSite();
      document.querySelectorAll("[data-site-name]").forEach(el => el.textContent = SITE["name_" + lang]);
      await content;
    })();
  </script>
<script src="/assets/back-home.js" defer></script>
<script src="/assets/cmdk.js" defer></script>
</body>
</html>
