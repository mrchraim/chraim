<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>تعيين كلمة مرور جديدة | CHRAIM</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="/assets/lib/supabase-js-2.117.3.js"></script>
</head>
<body class="auth-body">

  <div class="lang-switch">
    <button data-lang="ar" class="active" onclick="switchLang('ar')">عربي</button>
    <button data-lang="en" onclick="switchLang('en')">EN</button>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🔑</div>
        <h1 data-i18n="reset_title">تعيين كلمة مرور جديدة</h1>
        <p data-i18n="reset_subtitle">أدخل كلمة المرور الجديدة لحسابك</p>
      </div>

      <a class="back-to-site" href="login.html">↩ <span data-i18n="back_to_login">العودة لتسجيل الدخول</span></a>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="reset-password" data-i18n="new_password">كلمة المرور الجديدة</label>
          <input
            type="password"
            id="reset-password"
            data-i18n-placeholder="new_password"
            placeholder="كلمة المرور الجديدة"
            autocomplete="new-password"
            required
            minlength="6"
          />
        </div>
        <div class="form-group">
          <label for="reset-confirm" data-i18n="confirm_password">تأكيد كلمة المرور</label>
          <input
            type="password"
            id="reset-confirm"
            data-i18n-placeholder="confirm_password"
            placeholder="تأكيد كلمة المرور"
            autocomplete="new-password"
            required
            minlength="6"
          />
        </div>
        <button type="submit" id="reset-submit" class="btn btn-primary btn-block" data-i18n="update_password">
          تحديث كلمة المرور
        </button>
        <div id="reset-error" class="form-error" role="alert" style="display:none"></div>
        <div id="reset-success" class="form-success" role="status" style="display:none"></div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reset-password.js"></script>
<script src="/assets/back-home.js" defer></script>
<script src="/assets/cmdk.js" defer></script>
<script src="/assets/site-footer.js" defer></script>
<script src="/assets/site-nav.js" defer></script>
</body>
</html>
