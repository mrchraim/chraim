<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعلانات وأخبار الجامعات — منصة الطلبة</title>
  <meta name="description" content="آخر إعلانات الجامعات المغربية: التسجيلات، المسابقات، المنح، وآجال الترشيح — محدثة يومياً.">
  <link rel="stylesheet" href="css/site.css">
<link rel="canonical" href="https://chraim.pages.dev/platform/announcements">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">📚 <span data-site-name></span></a>
      <nav class="site-nav" id="site-nav">
        <a href="index.html" data-t="home"></a>
        <a href="browse.html" data-t="browse"></a>
        <a href="announcements.html" class="active" data-t="announcements"></a>
        <a href="contribute.html" data-t="contribute"></a>
        <a href="about.html" data-t="about"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">FR</button>
        <a href="account.html" class="btn btn-primary btn-sm" id="account-link" data-t="login"></a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
      </div>
    </div>
  </header>

  <div class="page-hero">
    <div class="container"><h1>📢 <span data-t="announcements"></span></h1></div>
  </div>

  <main class="container section">
    <div class="chips">
      <a class="chip" href="#" data-cat="" onclick="event.preventDefault();filterCat('')" data-t="all"></a>
      <a class="chip" href="#" data-cat="registration" onclick="event.preventDefault();filterCat('registration')" data-t="registration"></a>
      <a class="chip" href="#" data-cat="contest" onclick="event.preventDefault();filterCat('contest')" data-t="contest"></a>
      <a class="chip" href="#" data-cat="scholarship" onclick="event.preventDefault();filterCat('scholarship')" data-t="scholarship"></a>
      <a class="chip" href="#" data-cat="deadline" onclick="event.preventDefault();filterCat('deadline')" data-t="deadline"></a>
    </div>
    <div id="ann-list"><div class="empty"><span class="icon">⏳</span></div></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom"><span data-t="footer_rights"></span> © 2026 <span data-site-name></span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.querySelectorAll("[data-site-name]").forEach(el => el.textContent = SITE.name_ar);
    (async () => {
      const content = loadAnnouncements();
      await initSite();
      document.querySelectorAll("[data-site-name]").forEach(el => el.textContent = SITE["name_" + lang]);
      await content;
      document.addEventListener("langchange", loadAnnouncements);
    })();
  </script>
<script src="/assets/back-home.js" defer></script>
</body>
</html>
