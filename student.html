  <h2>ملفك المحفوظ</h2>

</div>

<p><a href="/" style="color:#D4AF37">← العودة للرئيسية</a></p>
<script>
try {
  const p = JSON.parse(localStorage.getItem('chraim_profile_v1')||'null');
  const el = document.getElementById('profile');
  if (p) {
    el.innerHTML = '<div>الفصل: '+ (p.sem||'—') +'</div><div>المسار: '+ (p.selectedPathwayName||'—') +'</div><div>النسب: '+ (p.name||'—') +'</div>';
  } else {
    el.textContent = 'لا يوجد ملف محفوظ. ابحث في الصفحة الرئيسية.';
  }
} catch(e){ document.getElementById('profile').textContent='تعذر قراءة الملف.'; }
</script>
